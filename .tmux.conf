# ============================================================
# 基本
# ============================================================

set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g history-limit 10000
set -g renumber-windows on
set -g display-time 1500
set -g focus-events on
setw -g mouse on

# 本来は 0 が望ましいが、WSL では 0 にすると入力が取りこぼされる
# https://github.com/microsoft/WSL/issues/5931
set -sg escape-time 1

# bind-key -r で連続入力を受け付ける時間
set -g repeat-time 400

# Ctrl+b はエディタのページ送りと衝突するため Ctrl+j に変更
unbind C-b
set -g prefix C-j

bind r source-file ~/.tmux.conf \; display " Reloaded config!"

# アプリケーション（画像表示など）が端末へ直接出力するのを許可
set -g allow-passthrough on

# Ctrl+Enter のような修飾キー付きの入力を区別できるようにする
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# セッションを開閉するたびに番号を詰め直す（set-hook は 2.4 以降）
if-shell -b '[ "$(echo "$TMUX_VERSION >= 2.4" | bc)" = 1 ]' '\
  set-hook -g session-created "run ~/dotfiles/bin/tmux-reorder-sessions.sh"; \
  set-hook -g session-closed  "run ~/dotfiles/bin/tmux-reorder-sessions.sh"; \
'

# ============================================================
# キー操作
# ============================================================

# --- コピーモード ---

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection

# tmux のバッファと X のクリップボードを連携させる
if-shell 'type xsel' \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xsel -ib'"
if-shell 'type xsel' \
  "bind-key -T copy-mode-vi Y send-keys -X copy-pipe 'xsel -ib'"
if-shell 'type xsel' \
  "bind ] run-shell \
    'xsel -ob | xargs -0 -I{} tmux set-buffer -- {} && tmux paste-buffer'"

# --- キーバインド ---

bind -n M-: command-prompt -p '>>>'

# < > で現在のウィンドウを左右に入れ替える（0 番より左へは動かさない）
unbind <
unbind >
bind -r < run 'cw=$(tmux display-message -p \#I) && [ $cw -gt 0 ] && tmux swap-window -s $cw -t $(($cw - 1))'
bind -r > run 'cw=$(tmux display-message -p \#I) && tmux swap-window -s $cw -t $(($cw + 1))'

# ペインの移動・リサイズを Vim のキー配置に合わせる
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# 全ペインへの同時入力
bind e setw synchronize-panes on
bind E setw synchronize-panes off

# ウィンドウ・ペインの新規作成はカレントディレクトリを引き継ぐ
unbind s
bind s new-window -c '#{pane_current_path}'
bind M-% split-window -hc "#{pane_current_path}"
bind M-'"' split-window -vc "#{pane_current_path}"

# ============================================================
# ステータスライン
# ============================================================

# --- 表示内容 ---

set -g status on
set -g status-keys vi
set -g status-justify centre
set -g status-interval 10
set-window-option -g allow-rename on

# 非アクティブなウィンドウの出力を検知して通知する
setw -g monitor-activity on
set -g visual-activity on

set -g status-left-length 50
set -g status-right-length 120

setw -g window-status-current-format "#[fg=colour230,bold] #I: #W #[default]"

# ウィンドウフラグから - （直前に選択したウィンドウ）だけを取り除く
# #{s/-//:window_flags} が - を除いたフラグ文字列
# 条件判定も置換後の値で行う。置換前で判定すると、- だけが立っている
# ウィンドウで空文字が出力され、他より 1 桁狭くなって桁がずれる
# # (活動) ! (ベル) ~ (無音) M (マーク) Z (ズーム) は残る
setw -g window-status-format "#I:#W#{?#{s/-//:window_flags},#{s/-//:window_flags}, }"

# prefix 押下中は #{?client_prefix,...} で減光し、待機状態を示す
set -g status-left \
"#{?client_prefix,#[dim],}#[fg=colour247,bold][#S] #(whoami)@#h #[default] "
set -g status-right \
"#{?client_prefix,#[dim],}#(tmux show-options -g prefix) |#[fg=colour247,bold] %m/%d %H:%M:%S #[default]"

# --- Claude Code の状態表示 ---

# 着色そのものは ~/.claude/settings.json のフックから行う。
# ここではウィンドウを離れた時／選んだ時に「完了」「承認待ち」を既読にする
# （「実行中」は既読にせず色を残す）。
set-hook -g pane-focus-out      'run-shell -b "$HOME/dotfiles/bin/tmux-claude-status.sh --ack #{window_id}"'
set-hook -g after-select-window 'run-shell -b "$HOME/dotfiles/bin/tmux-claude-status.sh --ack #{window_id}"'

# ============================================================
# 配色
# ============================================================

set -g status-style fg=colour245,bg=colour238

set -g message-style fg=colour250,bg=colour88
set -g message-command-style fg=colour250,bg=colour88

setw -g window-status-style fg=default,bg=default
setw -g window-status-current-style fg=colour202,bg=default

set -g pane-border-style fg=colour69,bg=default
set -g pane-active-border-style fg=colour69,bg=default
